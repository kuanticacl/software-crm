# CRM Vivienda en Regla · stack completo (app + base de datos) para Dokploy.
#
# - Servicios: vivienda-crm (app) y vivienda-crm-db (MariaDB).
# - Sin puertos publicados en el host: el puerto lo asigna/ruta Traefik (dominio configurado en Dokploy → crm.viviendaenregla.cl).
# - La base de datos vive en el mismo stack y solo es accesible por la red interna.
# - Todo se configura con variables de entorno (ver .env.dokploy.example).

services:
  vivienda-crm:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      vivienda-crm-db:
        condition: service_healthy
      vivienda-crm-redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Vivienda en Regla CRM}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?Define APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://crm.viviendaenregla.cl}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-clientes.viviendaenregla.cl}
      ASSET_URL: ${ASSET_URL:-}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mariadb
      DB_HOST: vivienda-crm-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-vivienda_crm}
      DB_USERNAME: ${DB_USERNAME:-vivienda}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_CLIENT: phpredis
      REDIS_HOST: vivienda-crm-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${DB_PASSWORD}}
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: ${MAIL_MAILER:-log}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Vivienda en Regla}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@viviendaenregla.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - crm-storage:/var/www/html/storage/app
    networks:
      - dokploy-network

  vivienda-crm-db:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-name-resolve", "--innodb-buffer-pool-size=256M"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-vivienda_crm}
      MARIADB_USER: ${DB_USERNAME:-vivienda}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: America/Santiago
    volumes:
      - crm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dokploy-network

  # Redis: sesiones y caché (la cola sigue en la base de datos para no perder trabajos pendientes).
  # Persistente (AOF) para que las sesiones sobrevivan a un reinicio; solo accesible por la red del stack con contraseña.
  vivienda-crm-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - crm-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dokploy-network

volumes:
  crm-storage:
  crm-db-data:
  crm-redis-data:

# Red compartida de Dokploy/Traefik (no crea redes nuevas). Los nombres de servicio son únicos (vivienda-crm-*)
# para no chocar con otros stacks que usan la misma red.
networks:
  dokploy-network:
    external: true
  # Dokploy agrega la red «default» al servicio con dominio; se fija su subred para no depender de los
  # pools de direcciones de Docker (el servidor los tiene agotados).
  default:
    ipam:
      config:
        - subnet: 10.231.77.0/24
