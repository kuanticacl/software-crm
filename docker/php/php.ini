expose_php = Off
; Defensa en profundidad (aviso de seguridad de PHP, oct-2026): el CRM no usa el seguimiento de subida por sesión.
; La corrección real es la versión de PHP fijada en el Dockerfile.
session.upload_progress.enabled = 0
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 25M
post_max_size = 25M
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Caché de rutas de archivos: menos llamadas al sistema de archivos por petición.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
